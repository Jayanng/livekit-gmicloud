[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-gmicloud"
dynamic = ["version"]
description = "A community LiveKit Agents TTS plugin for GMI Cloud"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Jayanng" }]
keywords = ["livekit", "agents", "tts", "gmi-cloud", "speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "livekit-agents[codecs]>=1.8.12",
    "aiohttp>=3.9",
]

[tool.hatch.version]
path = "src/livekit_gmicloud/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/livekit_gmicloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "build",
    "twine",
]
